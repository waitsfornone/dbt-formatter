name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - name: Smoke-test the built CLI
        run: |
          printf 'select a,b from t where x=1\n' > "$RUNNER_TEMP/smoke.sql"
          node dist/cli/formatter.js -f "$RUNNER_TEMP/smoke.sql" | grep -q 'x = 1'
